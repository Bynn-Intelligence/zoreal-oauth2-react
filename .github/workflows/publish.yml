# Auto-release @zoreal/oauth2-react on every push to main.
#
# Each push cuts the next patch: the workflow bumps the version, keeps the
# in-code SDK_VERSION in step, runs the checks, publishes to npm with
# provenance, and pushes the bump commit and tag back to main. The push back
# uses the default GITHUB_TOKEN, which by design does not retrigger this
# workflow, and the bump commit is tagged [skip publish] as a second guard.
#
# To ship without cutting a release (docs, CI tweaks), put [skip publish] in
# the commit message.
#
# The npm-publish environment is kept so npm trusted publishing can bind its
# OIDC trust to it. Leave that environment with no required reviewer for
# hands-off publishing.
name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: "!contains(github.event.head_commit.message, '[skip publish]')"
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # npm >= 11.5 for OIDC trusted publishing; harmless with a classic token.
      - run: npm install -g npm@latest
      - run: npm ci

      # Bump the patch version and keep the wire SDK_VERSION identical, so the
      # string the client sends on every request always matches the package.
      - id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          NEW=$(npm version patch --no-git-tag-version)
          NEW=${NEW#v}
          sed -i "s/export const SDK_VERSION = '[^']*';/export const SDK_VERSION = '${NEW}';/" src/wire.ts
          echo "version=${NEW}" >> "$GITHUB_OUTPUT"

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Record the release on main before publishing, so a published version is
      # always represented by a commit and tag. The tag carries [skip publish].
      - run: |
          git add package.json package-lock.json src/wire.ts
          git commit -m "Release v${{ steps.bump.outputs.version }} [skip publish]"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main --follow-tags

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - run: gh release create "v${{ steps.bump.outputs.version }}" --title "v${{ steps.bump.outputs.version }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
