# Publishes @zoreal/oauth2-react to npm when the version in package.json changes.
#
# Push to main with a bumped `version` and it publishes; a push that does not
# change the version is a green no-op, so ordinary commits never republish.
# A published GitHub Release and a manual dispatch also work, for an explicit
# out-of-band publish.
#
# The npm-publish environment is kept because npm trusted publishing binds its
# OIDC trust to (repository, workflow, environment). Add a required reviewer to
# that environment for one-click approval before each publish, or leave it with
# no reviewer for fully hands-off publishing on version bump.
#
# Provenance records which commit and workflow built the package.
name: Publish to npm

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Publish only when this exact version is not already on the registry.
      # A push that did not bump the version sets publish=false and the job
      # ends green without touching npm. A Release or manual dispatch of an
      # already-published version is an explicit mistake, so it fails loudly.
      - id: guard
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"
          if npm view "@zoreal/oauth2-react@${PKG_VERSION}" version >/dev/null 2>&1; then
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "@zoreal/oauth2-react@${PKG_VERSION} already published; nothing to do."
              echo "publish=false" >> "$GITHUB_OUTPUT"
            else
              echo "@zoreal/oauth2-react@${PKG_VERSION} already published; bump the version first." >&2
              exit 1
            fi
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.guard.outputs.publish == 'true'
        run: npm install -g npm@latest
      - if: steps.guard.outputs.publish == 'true'
        run: npm ci
      - if: steps.guard.outputs.publish == 'true'
        run: npm run typecheck
      - if: steps.guard.outputs.publish == 'true'
        run: npm test
      - if: steps.guard.outputs.publish == 'true'
        run: npm run build
      - if: steps.guard.outputs.publish == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
